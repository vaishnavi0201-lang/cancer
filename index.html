<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lung Cancer Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Lung Cancer Level Prediction</h2>

    <label for="age">Age:</label>
    <input type="number" id="age" placeholder="Enter Age">

    <label for="air">Air Pollution:</label>
    <input type="number" id="air" placeholder="Enter Air Pollution">

    <button onclick="predict()">Predict</button>

    <div class="result" id="result"></div>
</div>

<script>
    function predict() {
        const age = parseFloat(document.getElementById("age").value);
        const air = parseFloat(document.getElementById("air").value);

        if (isNaN(age) || isNaN(air)) {
            document.getElementById("result").innerText = "Please enter valid numbers.";
            return;
        }

        // Example linear regression equation
        // (Replace coefficients with your model values if needed)
        let prediction = (0.03 * age) + (0.5 * air) - 1;

        let level = "";
        if (prediction < 0.8) {
            level = "Low";
        } else if (prediction < 1.6) {
            level = "Medium";
        } else {
            level = "High";
        }

        document.getElementById("result").innerText =
            "Predicted Cancer Level: " + level;
    }
</script>

</body>
</html>
